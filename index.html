<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meine Web-Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: eine Spalte, Liste der Apps als grosse Tippflächen. */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --ink:#12171D; --muted:#5A6572; --line:#DCE2E8; --accent:#D2441B; --focus:#2F6FD6;
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow","Roboto",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0E1216; --surface:#171D23; --ink:#ECF0F3; --muted:#98A3AF; --line:#28313A; --accent:#F2693F; --focus:#7FA8F0; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 40px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;text-transform:uppercase}
p{margin:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a.app{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none}
a.app:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.05;text-transform:uppercase}
.app span{color:var(--muted);font-size:.95rem}
.app .go{margin-left:auto;color:var(--accent);font-size:1.6rem;flex-shrink:0}
.app div{min-width:0}
</style>
</head>
<body>
<main>
  <h1>Meine Web-Apps</h1>
  <p>Tippe auf eine App und füge sie in Chrome über „Zum Startbildschirm hinzufügen“ hinzu.</p>
  <ul>
    <li><a class="app" href="workout/"><div><b>Mein Workout</b><span>Intervall-Training mit Sets, Pausen, Bildern und Ansage</span></div><span class="go" aria-hidden="true">›</span></a></li>
  </ul>
</main>
</body>
</html>
